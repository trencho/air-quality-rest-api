# Dependabot version updates. Grouping minor+patch keeps majors in their own PR (excluded from
# auto-merge). Dependabot applies `ignore` retroactively — landing this auto-closes offending open PRs.
version: 2
updates:
  # Python deps. The requirements files live under /requirements (common/dev/prod, chained via -r).
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Dockerfile base images (docker/Dockerfile + the mongo image).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # PATCH bumps only (3.14.6 -> 3.14.7), deliberately. The docker ecosystem matches TAGS, which carry
    # no release-channel metadata, so the usual "pre-releases are not proposed unless you are already on
    # one" guarantee does not hold here: python:3.14.6-slim -> python:3.15.0rc1-slim was scored an
    # ordinary minor and auto-merged into both stages of this image (PR #28), leaving the container on a
    # release candidate while CI kept testing 3.14. A base-image minor is a runtime upgrade regardless —
    # it warrants a deliberate change with the suite run against it, not an unattended merge.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
