# Dependabot version updates. Grouping minor+patch keeps majors in their own PR (excluded from
# auto-merge). Dependabot applies `ignore` retroactively — landing this auto-closes offending open PRs.
version: 2
updates:
  # Python deps. The requirements files live under /requirements (common/dev/prod, chained via -r).
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: ci

  # Dockerfile base images (docker/Dockerfile + the mongo image).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: chore
    # No update-type restriction: majors, minors and patches all flow, and the guard that matters
    # for images -- blocking a RELEASE-CANDIDATE tag -- lives in dependabot-auto-merge.yml instead.
    # It has to: `docker` matches TAGS, which carry no release-channel metadata, so
    # `python:3.14.6-slim` -> `python:3.15.0rc1-slim` scores an ordinary MINOR, and
    # `ignore.versions` takes version RANGES rather than globs (dependabot-core#15154), so
    # "no pre-releases" cannot be written here at all.

  # Compose files -- a SEPARATE ecosystem from `docker`, which does NOT cover them. Before this
  # block existed the image tags in /docker were updated by nothing at all, because
  # `docker` was configured and containers read as handled.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore

  # Kubernetes manifests (27 files under /kubernetes) - TRIAL, this repo only.
  #
  # Handled by the `docker` ecosystem pointed at the manifest directory: the `kubernetes_updates`
  # feature flag was removed (dependabot-core#6144) and "update Docker image on Kubernetes
  # deployment files" (#2217) is closed. But the PUBLIC ecosystem table does not list Kubernetes,
  # so this is deliberately enabled on ONE repo first. If a PR appears for a manifest image tag,
  # roll the same block out to aqra-frontend (6 manifests); if nothing appears after a couple of
  # weekly runs, delete this block rather than leaving a config that implies coverage it lacks.
  - package-ecosystem: docker
    directory: /kubernetes
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
