# Self-gating Dependabot auto-merge. Waits for the CI `build` job (ci.yml) to pass, then merges
# Dependabot PRs directly - EVERY update type, majors included (workbench 0.1.18); only a
# pre-release target is held. No branch-protection or repo settings
# required — the workflow's GITHUB_TOKEN merges once the named check is green. (This repo is public,
# so native `gh pr merge --auto` is also available; the self-gated variant is used to avoid enabling
# branch protection on a personal project.)
#
# `build` is the gate: ci.yml runs on pull_request and exposes a job named `build`.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read
  # `gh workflow run` after the merge needs this. Without it the dispatch gets a 403, the
  # step warns and exits 0, and the bump merges without ever reaching the live site -- the
  # exact failure the dispatch was added to fix, wearing a green check.
  actions: write

jobs:
  auto-merge:
    # Gate on the PR's AUTHOR, not `github.actor` — the actor is whoever triggered this particular run,
    # so any human touching the branch (an "Update branch" click, a rebase) makes the condition false
    # and the job skips. This is the check GitHub's own Dependabot example uses.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Pre-release guard: the one thing that does NOT auto-merge. Registries expose a release
      # channel, but the docker/docker-compose ecosystems match image TAGS, which carry none -- so
      # `python:3.14.6-slim` -> `python:3.15.0rc1-slim` scores an ordinary MINOR and would merge
      # into a production image (it did, 2026-08-15). It cannot be expressed in dependabot.yml:
      # ignore.versions takes version RANGES, not globs (dependabot-core#15154).
      #
      # `new-version` is empty on a GROUPED PR, so the raw metadata JSON is checked too: if any
      # updated dependency looks like a pre-release, the whole PR is held. Failing toward "hold"
      # is deliberate -- a missed merge is a nuisance, a shipped release candidate is an incident.
      - name: Check for a pre-release target
        id: prerelease
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # A token counts only where it is not buried inside a longer alphabetic word: `3.15.0rc1`
          # is held, while `26.7.0-alpine` and `1.31-alpine` are ordinary releases and pass. Longest
          # alternatives first so `preview` is reported as itself rather than as `pre`.
          pattern='(^|[^a-zA-Z])(preview|insiders|snapshot|nightly|canary|alpha|beta|next|dev|pre|rc)([^a-zA-Z]|$)'
          held=false
          offender=""
          if [ -n "${NEW_VERSION:-}" ] && printf '%s' "$NEW_VERSION" | grep -qiE "$pattern"; then
            held=true
            offender="$NEW_VERSION"
          fi
          if [ -n "${UPDATED_JSON:-}" ]; then
            # jq ships on GitHub-hosted runners. On a self-hosted one without it this holds every
            # PR, so say which of the two failures it is -- an unexplained fleet-wide freeze is
            # exactly how the 0.1.18 bug went unnoticed for a day.
            if ! command -v jq >/dev/null 2>&1; then
              held=true
              offender="jq unavailable - cannot inspect grouped metadata"
            elif versions=$(printf '%s' "$UPDATED_JSON" | jq -r '.[]?.newVersion // empty'); then
              hit=$(printf '%s\n' "$versions" | grep -iE "$pattern" | head -n 1 || true)
              if [ -n "$hit" ]; then
                held=true
                offender="$hit"
              fi
            else
              held=true
              offender="unparseable metadata"
            fi
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          echo "offender=$offender" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "pre-release target detected ('$offender') - not auto-merging."
          fi

      - name: Explain a held pre-release
        if: ${{ steps.prerelease.outputs.held == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The offending VALUE, not `new-version` -- which is empty on exactly the
          # grouped PRs the metadata check exists to cover.
          OFFENDER: ${{ steps.prerelease.outputs.offender }}
        run: |
          gh pr comment "$PR_URL" --body "Held: this bump targets a **pre-release** version (\`$OFFENDER\`). Every other update type auto-merges; pre-releases need a human to confirm it is intended."

      # Actions bumps REWRITE A WORKFLOW FILE, and the workflows here can read the production
      # deploy secrets. SHA pinning is the control that makes a third-party action safe, and a
      # Dependabot bump rewrites the pin itself -- so auto-merging one accepts whatever SHA
      # upstream published, with no human in the loop.
      #
      # The VALUE is `github_actions`, with an UNDERSCORE. `dependabot.yml` spells the same
      # ecosystem `github-actions` with a hyphen, and a guard matching the hyphen holds nothing
      # while looking exactly like a working gate. Read off a real run's
      # `outputs.package-ecosystem:` log line, not assumed.
      - name: Hold a workflow-modifying bump for a human
        id: workflow_hold
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          held=false
          if [ "${ECOSYSTEM:-}" = "github_actions" ]; then
            held=true
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "github_actions bump - a workflow change needs a human, not auto-merging."
          fi

      # Said on the PR, not only in the log. A hold nobody is told about is indistinguishable from
      # a gate that silently stopped working.
      - name: Explain a held workflow bump
        if: ${{ steps.workflow_hold.outputs.held == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held: this bump modifies a **workflow file**, and the workflows here can read the production deploy secrets. SHA pinning is what makes a third-party action safe, and this bump rewrites the pin itself, so merging it accepts whatever SHA upstream published. Review the diff and merge manually."

      - name: Wait for CI, then merge
        if: ${{ steps.prerelease.outputs.held == 'false' && steps.workflow_hold.outputs.held == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The post-merge `gh workflow run` below has no checkout to take the repository from.
          # Without GH_REPO it fails with "not a git repository", warns, and the job still passes.
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # One check-run NAME per line. That is a job's `name:` when it has one, and its job id
          # otherwise; naming the wrong one makes this loop wait for a check that never appears
          # and time out instead of merging. One per line so a name containing spaces (e.g.
          # "build + test (JDK 25)") is not split apart by word-splitting.
          REQUIRED_CHECKS: |
            build
          # THE WORKFLOW TO DISPATCH AFTER A SUCCESSFUL MERGE, and why one is needed at all.
          #
          # `gh pr merge` below pushes with GITHUB_TOKEN, and a push made with GITHUB_TOKEN raises
          # NO workflow events. This file already invokes that anti-recursion rule for branch
          # updates further down; the same rule applies to the merge push, and it was never
          # followed through. The result is silent: master moves, and build-deploy.yml listens on `push: master`, so nothing builds, nothing pushes an image and nothing deploys. The bump reads as merged-and-green while production still runs the old image.
          #
          # Measured across this repo's whole history on 2026-09-19: every Dependabot PR merged by
          # `app/github-actions` raised no deploy, and every one merged by a human did. Same repo,
          # same deploy workflow, the only difference being who pressed merge.
          #
          # workflow_dispatch via the API is NOT suppressed -- only the push event is -- so the
          # dispatched run behaves like any other. Set to empty to opt out.
          DISPATCH_WORKFLOW: build-deploy.yml
          DISPATCH_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # master requires status checks with `strict` (branch must be up to date), because a merge
          # performed by GITHUB_TOKEN raises no workflow events -- so nothing re-verifies master
          # after an auto-merge, and two PRs that were each green against an older base can combine
          # into a broken tree. `strict` closes that by making the PR's green CI the merge result.
          #
          # This workflow merges directly instead of queueing GitHub's native auto-merge, so it has
          # to handle "behind" itself. It asks DEPENDABOT to rebase rather than updating the branch
          # here: a branch updated with GITHUB_TOKEN creates no CI run (same anti-recursion rule),
          # which would leave the branch up to date with no checks on the new head -- permanently
          # unable to satisfy the gate. Dependabot's own push does trigger CI, and the resulting
          # `synchronize` event re-runs this workflow against the new head.
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR_URL" --body '@dependabot rebase'
            echo "branch is behind master; asked Dependabot to rebase. A later run will merge it."
            exit 0
          fi

          for _ in $(seq 1 60); do
            pending=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              row=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                --jq ".check_runs[] | select(.name==\"$name\") | [.status,(.conclusion // \"\")] | @tsv" | tail -1)
              if [ -z "$row" ]; then pending=1; continue; fi
              status=$(printf '%s' "$row" | cut -f1)
              concl=$(printf '%s' "$row" | cut -f2)
              [ "$status" != "completed" ] && pending=1
              if [ "$status" = "completed" ] && [ "$concl" != "success" ]; then
                echo "required check '$name' concluded '$concl' — not merging."; exit 1
              fi
            done <<< "$REQUIRED_CHECKS"
            if [ "$pending" -eq 1 ]; then echo "waiting for required checks..."; sleep 20; continue; fi
            echo "all required checks green — merging."
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              # The merge landed. Now make something actually run on the new head -- see
              # DISPATCH_WORKFLOW above for why nothing does on its own.
              if [ -n "${DISPATCH_WORKFLOW:-}" ]; then
                if gh workflow run "$DISPATCH_WORKFLOW" --ref "$DISPATCH_REF"; then
                  echo "dispatched $DISPATCH_WORKFLOW on $DISPATCH_REF so the merge actually ships."
                else
                  # Loud on purpose, and NOT a failure: the merge succeeded and re-running this
                  # job would not undo it. A silent skip here would restore exactly the defect
                  # this dispatch exists to fix.
                  echo "::warning::merged, but could not dispatch $DISPATCH_WORKFLOW on $DISPATCH_REF."
                fi
              fi
              exit 0
            fi
            # The merge can be refused because the branch fell behind DURING the wait above. The
            # BEHIND check before this loop cannot see that: a sibling PR landing mid-loop is the
            # common case, not an edge one, and recreating several Dependabot PRs at once
            # guarantees it. Hand it back to Dependabot rather than failing the run -- a branch
            # updated with GITHUB_TOKEN would get no CI on the new head (the same anti-recursion
            # rule as above) and could never satisfy the gate.
            state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$state" = "BEHIND" ]; then
              gh pr comment "$PR_URL" --body '@dependabot rebase'
              echo "merge refused: branch fell behind during the wait; asked Dependabot to rebase."
              exit 0
            fi
            # Any other refusal is real and must stay loud. One seen in the wild: GitHub blocks a
            # GITHUB_TOKEN merge of a PR that edits a workflow file ("refusing to allow a GitHub
            # App to create or update workflow ... without `workflows` permission").
            echo "merge refused while mergeStateStatus=$state."; exit 1
          done
          echo "timed out waiting for required checks."; exit 1
