# TEMPORARY - delete before merging.
#
# Proves the OpenVPN apt-cache mechanics on a real runner. The deploy job itself never runs
# on a pull request, so without this the change would be unverifiable until after merge - and
# merging deploys to production. Deliberately triggered by `pull_request` and not
# `workflow_dispatch`: a workflow_dispatch workflow can only be triggered once it is on the
# DEFAULT branch, so it could not run from this branch at all.
#
# No VPN, no SSH, no deploy. It installs openvpn and proves the binary runs.
name: TEMP verify the OpenVPN apt cache

on: pull_request

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The cache key is built from these. If either is unset the key silently degrades to a
      # constant, which would hit forever and serve .debs from a retired image - the exact
      # staleness the key exists to prevent. Fail loudly rather than cache on a guess.
      - name: Resolve the runner image for the cache key
        id: runner_image
        run: |
          set -u
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error::ImageOS/ImageVersion are unset - the cache key would be constant"
            exit 1
          fi
          echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore the OpenVPN packages
        uses: actions/cache@v6
        with:
          path: .aptcache
          key: apt-openvpn-${{ runner.os }}-${{ steps.runner_image.outputs.id }}

      - name: Install OpenVPN
        timeout-minutes: 10
        run: |
          set -u
          if ls .aptcache/*.deb >/dev/null 2>&1; then
            echo "CACHE HIT - installing offline from $(ls .aptcache/*.deb | wc -l) .deb(s)"
            sudo dpkg -i .aptcache/*.deb
            echo "installed from cache: $(openvpn --version | head -1)"
            exit 0
          fi
          echo "CACHE MISS - downloading"
          mkdir -p .aptcache/partial
          sudo timeout 60 apt-get update -o Acquire::Retries=3
          sudo timeout 90 apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Dir::Cache::archives="$(pwd)/.aptcache" openvpn
          sudo chown -R "$(id -u):$(id -g)" .aptcache
          echo "downloaded $(ls .aptcache/*.deb | wc -l) .deb(s) for the next run"
          echo "installed from apt: $(openvpn --version | head -1)"

      # The point of dropping openvpn-systemd-resolved is that nothing invoked it. Prove the
      # binary is present and runnable regardless.
      - name: openvpn runs
        run: openvpn --version | head -2
