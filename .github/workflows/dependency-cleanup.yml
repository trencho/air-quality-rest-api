# Monthly dependency cleanup — reports what Dependabot cannot. Drop into a target project as
# .github/workflows/dependency-cleanup.yml. See references/dependency-automation-guide.md.
#
# Dependabot keeps versions MOVING FORWARD. Three things it never does, which this job covers:
#   1. Tell you a dependency is no longer used at all (dead weight, and dead attack surface).
#   2. Re-check a deliberately-held major to see whether upstream has unblocked it. A hold with
#      nothing re-testing it becomes a permanent freeze — TypeScript 7 and ESLint 10 sat in this
#      fleet's ignore blocks for a month with nothing looking at them.
#   3. Update the PACKAGE MANAGER itself — the `packageManager` field is unsupported
#      (dependabot-core#4830, open since 2022) and Maven wrapper support is merged but
#      flag-gated off (#14812). Gradle wrapper IS supported and needs no help here.
#
# REPORTS ONLY. It opens or updates one issue per month and never edits code, never removes a
# dependency, and never lifts a hold. Acting on it is a human's (or a review session's) call.
#
# Canonical shape (keep identical across repos so parity is checkable):
#   file:    dependency-cleanup.yml
#   name:    Dependency cleanup
#   job id:  cleanup
#   trigger: monthly schedule + workflow_dispatch
name: Dependency cleanup

on:
  schedule:
    # WEEKLY, gated to the first week by the `gate` job below — NOT "0 8 1-7 * 1".
    # cron ORs a restricted day-of-month with a restricted day-of-week, so `1-7 * 1` reads
    # "days 1-7 OR every Monday" and fires ~5 times a month. Observed 2026-08-17 (a Monday
    # outside the first week) on all nine repos running this job.
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC — after the weekly bumps have landed
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The schedule above fires every Monday; this decides whether it is the first one of the month.
  # It exists because cron cannot express "first Monday" — see the note on the schedule.
  gate:
    name: First-week gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - name: Is this the first week?
        id: week
        run: |
          # A manual dispatch is NEVER date-gated: you asked for it, you get it.
          #
          # `%-d` is UNPADDED and the test is plain `[ ]`, not `[[ ]]`/`(( ))`, both on purpose.
          # `%d` yields "08"/"09" and bash reads a leading zero as octal in arithmetic contexts,
          # so `[[ 08 -le 7 ]]` dies with "value too great for base". At THIS threshold the error
          # happens to land on the answer we wanted anyway (day 8 skips either way), so it is a
          # fragility rather than a live bug -- but it prints an error twice a month and turns
          # into a wrong answer the moment the window moves (`[[ 09 -le 10 ]]` errors to false).
          # Unpadded input compared with `[ ]` is base-10 and correct at any threshold.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the first week of the month; skipping the monthly report." >> "$GITHUB_STEP_SUMMARY"
          fi

  cleanup:
    name: Dependency cleanup
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the report
        run: |
          {
            echo "Generated by \`dependency-cleanup.yml\` on $(date -u +%Y-%m-%d)."
            echo
            echo "Report only — nothing here has been changed. Each section says what to do."
          } > report.md
          # Every step runs in its OWN shell, so the findings tally cannot be a variable. It is a
          # file beside report.md, which is how report.md itself survives between steps.
          #
          # ONLY the two deterministic sections tally: a hold that cleared, an un-annotated hold, a
          # package manager or wrapper behind its newest stable. The unused-dependency detectors
          # deliberately do NOT — their output is a tool dump whose findings are candidates, not
          # facts (every Spring Boot starter reads as "unused", every first-party module as
          # "undeclared"), so counting them would reopen this issue every month forever. The
          # closing comment says which sections were counted, so "closed as clear" is never read
          # as a claim about the section that was not.
          : > actionable.txt

      # ============================================================================================
      # (1) UNUSED DEPENDENCIES for this repo's stack (python).
      # Every detector guesses: a dependency loaded dynamically, by a config file, or by a build
      # plugin can look unused when it is not. Treat the output as candidates, never as a delete
      # list. `|| true` keeps a detector's non-zero "findings" exit from failing the job.
      #
      # Maven note: `dependency:analyze` reports BOTH "unused declared" and "used undeclared". The
      # second matters more — it is a transitive you rely on without declaring, which breaks the
      # day the intermediate stops pulling it in.
      #
      # ============================================================================================

      # --- (B) Python ---
      - uses: actions/setup-python@v7
        with: { python-version: '3.14' }
      - name: Unused dependencies (deptry)
        run: |
          echo -e "\n## Unused dependencies (deptry)\n" >> report.md
          echo '```' >> report.md
          req=$(ls requirements/*.txt requirements.txt 2>/dev/null | paste -sd, -)
          pipx run deptry . --no-ansi ${req:+--requirements-files "$req"} >> report.md 2>&1 || true
          echo '```' >> report.md

      # ============================================================================================
      # (2) HELD MAJORS — re-test every `# lift-when:` condition in .github/dependabot.yml.
      #
      # The convention (see templates/dependabot/dependabot.yml): every `ignore:` entry carries a
      # machine-readable release condition in one of these forms —
      #
      #   # lift-when: npm-peer <host-pkg> allows <peer-pkg> >=<version>
      #   # lift-when: npm-latest <pkg> >=<version>
      #   # lift-when: pypi-latest <pkg> >=<version>
      #   # lift-when: eol-lts <endoflife-product> <cycle>
      #   # lift-when: manual <free text>   (reported verbatim, never auto-tested)
      #
      # `eol-lts` is what connects references/runtime-lts-policy.md to the thing that actually
      # performs the bumps. A runtime base image is held at the current LTS major, and this clears
      # the hold on the day the next major ENTERS LTS - not the day it is released.
      #
      # Anything unrecognised is reported as needing a human rather than silently passing — an
      # unparsed hold must not read as a cleared one.
      # ============================================================================================
      - name: Re-check held versions
        run: |
          set -uo pipefail
          echo -e "\n## Held versions (\`ignore:\` entries)\n" >> report.md

          conf=.github/dependabot.yml
          if [ ! -f "$conf" ]; then
            echo "_No \`$conf\` in this repo._" >> report.md
            exit 0
          fi

          mapfile -t holds < <(grep -oP '(?<=# lift-when:).*' "$conf" | sed 's/^ *//;s/ *$//')
          if [ "${#holds[@]}" -eq 0 ]; then
            if grep -q '^\s*ignore:' "$conf"; then
              echo "> **Un-annotated holds.** \`$conf\` has \`ignore:\` entries but no \`# lift-when:\` lines," >> report.md
              echo "> so nothing can re-test them. Annotate each one — see the dependabot template." >> report.md
              echo "un-annotated holds" >> actionable.txt
            else
              echo "_No held versions._" >> report.md
            fi
            exit 0
          fi

          echo "| Hold | Upstream now | Clear? |" >> report.md
          echo "|---|---|---|" >> report.md

          for hold in "${holds[@]}"; do
            kind=$(printf '%s' "$hold" | awk '{print $1}')
            now="-"; clear="needs a human"
            case "$kind" in
              npm-peer)
                # npm-peer <host> allows <peer> >=<version>
                host=$(printf '%s' "$hold" | awk '{print $2}')
                peer=$(printf '%s' "$hold" | awk '{print $4}')
                want=$(printf '%s' "$hold" | awk '{print $5}' | tr -d '>=')
                range=$(npm view "$host@latest" "peerDependencies.$peer" 2>/dev/null || true)
                now="\`$host\` peers \`$peer@${range:-none}\`"
                if [ -n "$range" ] && npx --yes semver@7 -r "$range" "$want.0.0" >/dev/null 2>&1; then
                  clear="**YES — lift it**"
                elif [ -z "$range" ]; then
                  clear="peer dropped; check by hand"
                else
                  clear="no, still blocked"
                fi
                ;;
              npm-latest)
                pkg=$(printf '%s' "$hold" | awk '{print $2}')
                want=$(printf '%s' "$hold" | awk '{print $3}' | tr -d '>=')
                latest=$(npm view "$pkg" version 2>/dev/null || true)
                now="\`$pkg@${latest:-unknown}\`"
                # "could not reach the registry" must never read as "still blocked" — a lookup
                # failure that reports a negative is how a hold outlives its reason.
                if [ -z "$latest" ]; then
                  clear="could not check"
                elif npx --yes semver@7 -r ">=$want" "$latest" >/dev/null 2>&1; then
                  clear="**YES — lift it**"
                else
                  clear="no, not published yet"
                fi
                ;;
              pypi-latest)
                pkg=$(printf '%s' "$hold" | awk '{print $2}')
                want=$(printf '%s' "$hold" | awk '{print $3}' | tr -d '>=')
                latest=$(curl -fsSL "https://pypi.org/pypi/$pkg/json" 2>/dev/null | jq -r '.info.version' || true)
                now="\`$pkg==${latest:-unknown}\`"
                if [ -z "$latest" ] || [ "$latest" = "null" ]; then
                  clear="could not check"
                elif [ "$(printf '%s\n%s\n' "$want" "$latest" | sort -V | head -1)" = "$want" ]; then
                  clear="**YES — lift it**"
                else
                  clear="no, not published yet"
                fi
                ;;
              eol-lts)
                # eol-lts <product> <cycle> -- clears when THAT cycle has entered LTS.
                #
                # The `lts` field is NOT one type across products, and getting this wrong is the
                # exact bug this form exists to prevent:
                #   nodejs           -> a DATE ("2026-10-28"). A future date means NOT YET LTS, so a
                #                       truthiness test reads an unreleased LTS as a released one.
                #   eclipse-temurin  -> a BOOLEAN (true/false).
                #   either           -> false, meaning that cycle is never an LTS.
                # There is also no `java` product; Java resolves per distribution.
                product=$(printf '%s' "$hold" | awk '{print $2}')
                cycle=$(printf '%s' "$hold" | awk '{print $3}')
                json=$(curl -fsSL "https://endoflife.date/api/${product}.json" 2>/dev/null || true)
                if [ -z "$json" ]; then
                  now="\`$product\` unreachable"; clear="could not check"
                else
                  lts=$(printf '%s' "$json" | jq -r --arg c "$cycle" \
                          '.[] | select((.cycle|tostring) == $c) | (.lts|tostring)' 2>/dev/null | head -1)
                  today=$(date -u +%F)
                  # A cycle the product has not shipped yet is a DEFINITE "keep holding", not a
                  # failure to look. A Java hold must name the next LTS (29), which endoflife.date
                  # will not list until it exists — so the correct annotation would otherwise read
                  # as broken for a year and invite someone to "fix" it by naming a nearer,
                  # non-LTS cycle.
                  maxc=$(printf '%s' "$json" | jq -r \
                           '[.[].cycle | tostring | select(test("^[0-9]+$")) | tonumber] | max // empty' 2>/dev/null || true)
                  case "$lts" in
                    "")
                      if printf '%s' "$cycle" | grep -qE '^[0-9]+$' && [ -n "$maxc" ] && [ "$cycle" -gt "$maxc" ]; then
                        now="\`$product $cycle\` is unreleased (newest cycle is $maxc)"
                        clear="no, not released yet"
                      else
                        now="\`$product\` has no cycle \`$cycle\`"; clear="could not check"
                      fi
                      ;;
                    "true")    now="\`$product $cycle\` is LTS";           clear="**YES - lift it**" ;;
                    "false")   now="\`$product $cycle\` is not an LTS line"; clear="no, never LTS" ;;
                    null)      now="\`$product $cycle\` has no \`lts\` field"; clear="could not check" ;;
                    *)
                      now="\`$product $cycle\` LTS on $lts"
                      # String compare is correct and total for ISO-8601 dates.
                      if [ "$lts" \< "$today" ] || [ "$lts" = "$today" ]; then
                        clear="**YES - lift it**"
                      else
                        clear="no, not LTS until $lts"
                      fi
                      ;;
                  esac
                fi
                ;;
              manual) now="_not machine-testable_" ;;
              *)      now="_unrecognised \`lift-when\` form_" ;;
            esac
            echo "| $hold | $now | $clear |" >> report.md
            # A cleared hold is the one thing in this section that asks for work.
            case "$clear" in *"lift it"*) echo "hold cleared: $hold" >> actionable.txt ;; esac
          done

      # ============================================================================================
      # (3) PACKAGE-MANAGER CURRENCY — the gap Dependabot cannot cover (see the header).
      # ============================================================================================
      - name: Check package-manager currency
        run: |
          set -uo pipefail
          echo -e "\n## Package manager\n" >> report.md
          found=0

          if [ -f package.json ]; then
            pinned=$(jq -r '.packageManager // empty' package.json)
            if [ -n "$pinned" ]; then
              found=1
              name=${pinned%@*}; have=${pinned#*@}; have=${have%%+*}

              # WHICH PACKAGE CARRIES THE LINE YOU ARE ON. `yarn` on npm is Yarn *classic* and its
              # latest is 1.22.22 — frozen since 2024. Yarn 2+ ("Berry") ships as `@yarnpkg/cli`.
              # Querying `yarn` for a Berry repo reports 4.18.0 as behind 1.22.22 and recommends a
              # DOWNGRADE across three majors, which would break the repo. Observed 2026-08-17.
              query=$name
              if [ "$name" = "yarn" ] && [ "${have%%.*}" -ge 2 ] 2>/dev/null; then
                query="@yarnpkg/cli"
              fi

              # `|| true` on every probe: `pipefail` is on, so an offline registry or a grep with
              # no match would otherwise fail the step and lose the whole report.
              latest=$(npm view "$query" version 2>/dev/null || true)
              if [ -z "$latest" ]; then
                # A lookup that could not run must never print as a recommendation.
                echo "- \`packageManager\`: \`$pinned\` — could not reach the registry for \`$query\`." >> report.md
              elif [ "$have" != "$latest" ]; then
                echo "- \`packageManager\`: **$name@$have** -> latest **$latest** (from \`$query\`)." >> report.md
                echo "  Update with \`corepack use $name@$latest\` (Dependabot cannot: dependabot-core#4830)." >> report.md
                echo "packageManager behind: $name@$have -> $latest" >> actionable.txt
              else
                echo "- \`packageManager\`: \`$pinned\` is current." >> report.md
              fi
            fi
          fi

          wrapper=.mvn/wrapper/maven-wrapper.properties
          if [ -f "$wrapper" ]; then
            found=1
            have=$(grep -oP '(?<=apache-maven-)[0-9.]+(?=-bin)' "$wrapper" 2>/dev/null | head -1 || true)

            # NEITHER `<latest>` NOR `<release>` IS NECESSARILY STABLE. Central currently reports
            # both as `4.0.0-rc-6` for apache-maven, so reading either recommends a release
            # candidate for production builds (observed 2026-08-17). Take the version list, drop
            # anything carrying a pre-release token, and pick the highest that remains.
            latest=$(curl -fsSL https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/maven-metadata.xml 2>/dev/null \
                     | grep -oP '(?<=<version>)[^<]+' \
                     | grep -vEi -- '-(rc|alpha|beta|m|milestone|preview|snapshot)' \
                     | sort -V | tail -1 || true)
            if [ -z "$latest" ]; then
              echo "- Maven wrapper: \`$have\` — could not resolve a stable release from Central." >> report.md
            elif [ "$have" != "$latest" ]; then
              echo "- Maven wrapper: **$have** -> newest **stable** **$latest**. Update with \`./mvnw wrapper:wrapper -Dmaven=$latest\`." >> report.md
              echo "  (Dependabot support merged 2026-08-11 but is flag-gated off — adopt it when it ships and drop this check.)" >> report.md
              echo "maven wrapper behind: $have -> $latest" >> actionable.txt
            else
              echo "- Maven wrapper: \`$have\` is the newest stable release." >> report.md
            fi
          fi

          [ "$found" -eq 0 ] && echo "_No pinned package manager in this repo._" >> report.md
          true

      # ============================================================================================
      # (4) Publish — the tracker must show CURRENT state, not an archive of every run.
      #
      # The version before 2026-08-18 only ever created or edited. It never closed anything, and it
      # never asked whether the report contained a finding — so a clean month still left an issue
      # open, and because the title carries YYYY-MM, September opened a second one beside it. The
      # fleet reached nine permanently-open issues, six of them still advising a Yarn DOWNGRADE and
      # a Maven release candidate that had been fixed the day after they were written. An issue
      # nobody can trust is worse than no issue: it trains you to stop reading the tracker.
      #
      # So: findings -> open (or reopen) and edit. No findings -> close, saying why. Either way,
      # every older month closes as superseded, which is what stops the pile-up.
      # ============================================================================================
      - name: Publish the cleanup issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Dependency cleanup — $(date -u +%Y-%m)"
          count=$(wc -l < actionable.txt | tr -d ' ')
          cat report.md >> "$GITHUB_STEP_SUMMARY"

          # Search BOTH states. Looking only at open issues means a human who closed this month's
          # issue gets a duplicate created beside it on the next run.
          existing=$(gh issue list --state all --search "$title in:title" --json number,title,state \
                     --jq "map(select(.title==\"$title\")) | .[0].number // empty")

          if [ "$count" -gt 0 ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file report.md
              gh issue reopen "$existing" 2>/dev/null || true
              echo "updated issue #$existing ($count actionable)"
              current="$existing"
            else
              gh issue create --title "$title" --body-file report.md --label dependencies 2>/dev/null \
                || gh issue create --title "$title" --body-file report.md
              current=$(gh issue list --state open --search "$title in:title" --json number,title \
                        --jq "map(select(.title==\"$title\")) | .[0].number // empty")
              echo "opened issue #$current ($count actionable)"
            fi
          else
            current=""
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file report.md
              gh issue comment "$existing" --body \
                "Closed automatically: this run found nothing actionable in the counted sections (held versions, package-manager currency). The unused-dependency section is advisory and is not counted — read it in the body above. Reopens by itself if a later run finds something."
              gh issue close "$existing" 2>/dev/null || true
              echo "closed issue #$existing (nothing actionable)"
            else
              echo "nothing actionable and no existing issue — created none"
            fi
          fi

          # Supersede every EARLIER month. Without this the tracker grows by one issue per repo per
          # month forever, and the oldest — the least accurate — sit at the top of the list.
          gh issue list --state open --search "Dependency cleanup in:title" --json number,title \
            --jq '.[] | [.number, .title] | @tsv' \
          | while IFS=$'\t' read -r num t; do
              case "$t" in
                "Dependency cleanup — "*) ;;
                *) continue ;;
              esac
              [ "$t" = "$title" ] && continue
              [ -n "$current" ] && [ "$num" = "$current" ] && continue
              gh issue comment "$num" --body \
                "Superseded by the ${title#Dependency cleanup — } run. Each report describes the tree as it was on the day it ran; this one is no longer current."
              gh issue close "$num" 2>/dev/null || true
              echo "closed superseded issue #$num"
            done
