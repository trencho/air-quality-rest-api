# Monthly GHCR retention — prunes the container versions every build leaves behind. Drop into a
# target project as .github/workflows/package-retention.yml, but ONLY if the repo publishes images.
# See references/dependency-automation-guide.md.
#
# WHY THIS EXISTS. A repo that tags `:latest` AND `:<sha>` on every merge accumulates one permanent
# version per build, and container versions never expire. (GitHub Actions *caches* are the other
# thing that piles up, and they need no job here: they evict themselves after 7 idle days and at a
# 10 GB per-repo ceiling.)
#
# ---------------------------------------------------------------------------------------------
# READ THIS FIRST: "UNTAGGED" DOES NOT MEAN "UNREFERENCED".
#
# An earlier version of this template deleted every untagged version, on the stated grounds that an
# untagged version is unreachable by tag and cannot be a rollback target. That is FALSE, and acting
# on it destroyed a real package on 2026-08-16: all nine tags survived and not one of them resolved.
#
# `docker/build-push-action` v6+ attaches provenance attestations by default, so what a tag points
# at is an OCI **image index**, not an image. The index is the tagged version; the per-platform
# image manifest and the attestation manifest underneath it are separate versions that carry NO
# TAG OF THEIR OWN. Delete the untagged children and the tag still lists, still resolves to an
# index, and pulls nothing — every layer it names is gone. Multi-arch images have the same shape
# for the same reason.
#
# There is a second consequence worth internalising: when a repo tags every build with its commit
# SHA, moving `:latest` orphans nothing, because the old index keeps its SHA tag. So on a
# SHA-tagging repo almost every untagged version IS a live index child, and the honest expected
# result of pass 1 is that it deletes NOTHING. Pass 2 is the real cleanup there.
#
# This template therefore resolves the reference graph from the registry before deleting anything:
# a version is deletable only if it is untagged AND no tagged index points at it.
#
# ---------------------------------------------------------------------------------------------
# DELETION IS IRREVERSIBLE. Read before enabling.
#
#   - Run it once via `workflow_dispatch` and read the inventory in the job summary BEFORE trusting
#     the schedule. The inventory is read-only and always runs first.
#   - Pass 1 (untagged) now skips itself entirely when the graph is unavailable or when nothing is
#     safely deletable. It fails toward keeping: no graph, no deletion.
#   - Pass 2 (prune old tagged builds) ships COMMENTED OUT. It deletes real, addressable images —
#     but it is the correct pass, because deleting a tagged index makes its children unreferenced
#     and pass 1 can then collect them on the following month.
#   - `package-name` must name the package, not the repo, when they differ (a monorepo publishing
#     several images needs one job per package).
#   - GITHUB_TOKEN can only delete a package that is LINKED to this repository. An unlinked
#     package needs a PAT with `delete:packages` in a secret instead.
#
# Canonical shape (keep identical across repos so parity is checkable):
#   file:    package-retention.yml
#   name:    Package retention
#   job id:  prune
#   trigger: monthly schedule + workflow_dispatch
name: Package retention

on:
  schedule:
    # WEEKLY, gated to the first week by the `gate` job below — NOT "0 9 1-7 * 1".
    # cron ORs a restricted day-of-month with a restricted day-of-week, so `1-7 * 1` reads
    # "days 1-7 OR every Monday". A pass that can DELETE must run as often as its header
    # claims and no more; this one was running ~5x a month. Observed 2026-08-17.
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC — an hour after dependency-cleanup
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-retention
  cancel-in-progress: false

jobs:
  # The schedule above fires every Monday; this decides whether it is the first one of the month.
  # It exists because cron cannot express "first Monday" — see the note on the schedule.
  gate:
    name: First-week gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - name: Is this the first week?
        id: week
        run: |
          # A manual dispatch is NEVER date-gated: you asked for it, you get it.
          #
          # `%-d` is UNPADDED and the test is plain `[ ]`, not `[[ ]]`/`(( ))`, both on purpose.
          # `%d` yields "08"/"09" and bash reads a leading zero as octal in arithmetic contexts,
          # so `[[ 08 -le 7 ]]` dies with "value too great for base". At THIS threshold the error
          # happens to land on the answer we wanted anyway (day 8 skips either way), so it is a
          # fragility rather than a live bug -- but it prints an error twice a month and turns
          # into a wrong answer the moment the window moves (`[[ 09 -le 10 ]]` errors to false).
          # Unpadded input compared with `[ ]` is base-10 and correct at any threshold.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the first week of the month; skipping the retention pass." >> "$GITHUB_STEP_SUMMARY"
          fi

  prune:
    name: Prune old container versions
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # Read-only. Resolves the reference graph AND reports the inventory. Everything downstream
      # keys off `deletable`, which is 0 unless this step positively proved a version is safe to
      # remove — so any failure here disables the deletion rather than widening it.
      - name: Resolve reference graph and inventory
        id: graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail

          # Registry auth: ghcr.io takes the Actions token base64-encoded as a bearer token.
          REG_TOKEN=$(printf '%s' "$GITHUB_TOKEN" | base64 -w0)
          REG="https://ghcr.io/v2/${OWNER}/${PACKAGE}"
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          # 1. Every tag, and every digest any tagged index points at. A tag that cannot be
          #    resolved contributes nothing, which is the safe direction only because a failure
          #    to build the graph disables deletion outright (see `graph_ok` below).
          #    PAGINATE. `/v2/<name>/tags/list` returns at most 100 tags and advertises the rest in
          #    a `Link: rel="next"` header. Reading only the first page does not fail and does not
          #    warn -- it silently yields a SHORTER referenced set, so on a package with more than
          #    100 tags the oldest tags' children look unreferenced and are deleted. That happened
          #    on 2026-09-01: 106 tags, 100 read, 200 referenced digests instead of 315, and the 10
          #    children of the 5 unseen indexes were destroyed. Five tags still list and resolve to
          #    nothing -- the 2026-08-16 failure again, by truncation instead of a false premise.
          graph_ok=1
          : > tags.txt
          next="/v2/${OWNER}/${PACKAGE}/tags/list?n=100"
          while [ -n "$next" ]; do
            hdrs=$(mktemp)
            page=$(curl -sf -D "$hdrs" -H "Authorization: Bearer $REG_TOKEN" "https://ghcr.io${next}") \
              || { graph_ok=0; rm -f "$hdrs"; break; }
            # tr -d '\r': a Windows jq emits CRLF, which would make every tag "t1\r" and every
            # manifest lookup miss. On a Linux runner this is a no-op; it keeps the local suite
            # honest rather than green-on-CI and broken here.
            printf '%s' "$page" | jq -r '.tags[]? // empty' | tr -d '\r' >> tags.txt
            next=$(tr -d '\r' < "$hdrs" | sed -n 's/^[Ll]ink: *<\([^>]*\)>; *rel="next".*/\1/p' | head -1)
            rm -f "$hdrs"
          done
          tags=$(sort -u tags.txt)

          : > referenced.txt
          if [ "$graph_ok" = "1" ]; then
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              body=$(curl -sf -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
                       "$REG/manifests/$tag") || { graph_ok=0; break; }
              # The tagged version itself, plus every child of an index.
              printf '%s' "$body" | jq -r '.manifests[]?.digest // empty' >> referenced.txt
            done <<< "$tags"
          fi

          # 2. Every version GitHub knows about. NOTE the route: packages are owned by a USER or an
          #    ORG, and there is no /repos/{owner}/{repo}/packages/... endpoint — an earlier version
          #    of this template called exactly that, got a 404, swallowed it, and reported an
          #    inventory of zero forever.
          owner_type=$(gh api "repos/${{ github.repository }}" --jq '.owner.type' 2>/dev/null || echo '')
          case "$owner_type" in
            Organization) base="orgs/${OWNER}" ;;
            User)         base="users/${OWNER}" ;;
            *)            base='' ;;
          esac

          versions='[]'
          if [ -n "$base" ]; then
            versions=$(gh api "${base}/packages/container/${PACKAGE}/versions" --paginate 2>/dev/null \
                       | jq -s '[.[][]]' 2>/dev/null) || versions='[]'
          fi
          [ -n "$versions" ] || versions='[]'

          total=$(printf '%s' "$versions" | jq 'length')
          untagged_all=$(printf '%s' "$versions" \
            | jq '[.[] | select(((.metadata.container.tags) // []) | length == 0)] | length')

          sort -u referenced.txt > referenced.sorted || true
          ref_count=$(wc -l < referenced.sorted | tr -d ' ')

          # 3. Deletable = untagged AND referenced by no tagged index.
          deletable_json=$(printf '%s' "$versions" | jq -c --rawfile refs referenced.sorted '
            ($refs | split("\n") | map(select(length > 0))) as $r
            | [ .[]
                | select(((.metadata.container.tags) // []) | length == 0)
                | select(.name as $d | ($r | index($d)) | not) ]')
          deletable=$(printf '%s' "$deletable_json" | jq 'length')
          kept=$((untagged_all - deletable))

          # Compare TAG NAMES, which both sides report directly: GitHub lists the tags on every
          # version, the registry lists the tags it served. Comparing digests instead would need an
          # extra request per tag -- one more thing that can fail and silently shrink the graph,
          # which is the very failure being guarded against.
          api_tag_count=$(printf '%s' "$versions" \
            | jq '[.[] | ((.metadata.container.tags) // [])[]] | unique | length')
          reg_tag_count=$(sort -u tags.txt 2>/dev/null | wc -l | tr -d ' ')
          incomplete_note=""
          if [ "$api_tag_count" != "$reg_tag_count" ]; then
            graph_ok=0
            incomplete_note="GitHub reports ${api_tag_count} tag(s); the registry listing served ${reg_tag_count}"
          fi

          # If the graph could not be built we do not know what is referenced, so nothing is safe.
          if [ "$graph_ok" != "1" ] || [ "$ref_count" = "0" ]; then
            deletable=0
            graph_note="**graph incomplete or unavailable — deletion disabled for this run**"
            if [ -n "$incomplete_note" ]; then
              graph_note="${graph_note}<br>${incomplete_note}"
            fi
          else
            graph_note="graph resolved from ${ref_count} referenced digest(s) across ${reg_tag_count} tag(s)"
          fi

          {
            echo "## Container versions for \`$PACKAGE\`"
            echo
            echo "- total: **$total**"
            echo "- untagged: **$untagged_all**"
            echo "- untagged but REFERENCED by a tagged index (kept): **$kept**"
            echo "- safely deletable: **$deletable**"
            echo
            echo "$graph_note"
            if [ "$deletable" = "0" ]; then
              echo
              echo "Nothing to delete. On a repo that tags every build with its commit SHA this is"
              echo "the expected result — moving \`:latest\` orphans nothing, so untagged versions"
              echo "are index children of live tags. Pass 2 is the cleanup that applies there."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # `ignore-versions` is a regex over the version NAME, which for a container is the digest.
          if [ "$ref_count" != "0" ]; then
            ignore="^($(paste -sd'|' referenced.sorted))$"
          else
            ignore='^$'
          fi
          {
            echo "deletable=$deletable"
            echo "ignore=$ignore"
            echo "graph_ok=$graph_ok"
          } >> "$GITHUB_OUTPUT"

      # --- Pass 1: genuinely unreferenced untagged versions. ---
      # Skipped unless the step above positively identified something safe to remove. `ignore-versions`
      # is belt-and-braces on top of that: even if the action's own selection is broader than ours,
      # every digest a live tag depends on is excluded by name.
      - name: Delete unreferenced untagged versions
        if: steps.graph.outputs.deletable != '0'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: "0"
          ignore-versions: ${{ steps.graph.outputs.ignore }}

      - name: Report a skipped pass 1
        if: steps.graph.outputs.deletable == '0'
        run: echo "pass 1 skipped - nothing is both untagged and unreferenced (see the job summary)"

      # --- Pass 2: old tagged builds. DESTRUCTIVE. This is the cleanup that actually shrinks a
      # SHA-tagging repo, because pass 1 correctly deletes nothing there.
      #
      # WHY THIS IS NOT `actions/delete-package-versions`. That action's `min-versions-to-keep`
      # counts VERSIONS, and one buildx build is THREE versions (index + platform manifest +
      # attestation). So "10" keeps about three builds, not ten -- this file claimed otherwise until
      # 2026-09-01. Worse, a version-count cutoff cannot respect a build boundary: land the cutoff
      # mid-build and it keeps an index while deleting that index's children, which is exactly the
      # broken-tag state the 2026-09-01 incident produced. A tag that lists and then fails on pull is
      # worse than an absent one, so the unit of deletion here is a BUILD, never a version.
      #
      # Deletes whole builds, oldest first, keeping the newest KEEP_BUILDS. Refuses to touch a build
      # tagged `latest`, and refuses any build that shares a child with a build being kept.
      - name: Prune old tagged builds
        env:
          # GH_TOKEN is what `gh` reads; GITHUB_TOKEN is what the registry auth line base64-encodes.
          # Both are needed, and omitting the second failed this step with `unbound variable` on its
          # first real run -- after a suite that could not possibly have caught it, because the test
          # harness exported GITHUB_TOKEN itself. A dependency the test supplies is a dependency the
          # test cannot check the wiring of.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          KEEP_BUILDS: "20"
        run: |
          set -uo pipefail

          # Pass 2 deletes REACHABLE images, so it runs only when the graph step proved it could see
          # the whole package. Same rule as pass 1: no graph, no deletion.
          if [ "${{ steps.graph.outputs.graph_ok }}" != "1" ]; then
            echo "graph incomplete -- pass 2 skipped (see the job summary)"
            exit 0
          fi

          # This step gets its own registry credentials: REG_TOKEN and ACCEPT are shell locals of the
          # graph step and do not survive into another step's shell.
          REG_TOKEN=$(printf '%s' "$GITHUB_TOKEN" | base64 -w0)
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          owner_type=$(gh api "repos/${{ github.repository }}" --jq '.owner.type' 2>/dev/null || echo '')
          case "$owner_type" in
            Organization) base="orgs/${OWNER}" ;;
            User)         base="users/${OWNER}" ;;
            *) echo "cannot resolve owner type -- pass 2 skipped"; exit 0 ;;
          esac

          versions=$(gh api "${base}/packages/container/${PACKAGE}/versions" --paginate 2>/dev/null \
                     | jq -s '[.[][]]') || { echo "packages API unavailable -- pass 2 skipped"; exit 0; }

          # Builds = tagged versions, oldest first. Everything past the newest KEEP_BUILDS is a
          # candidate; its children come with it, which is what makes the unit a build.
          builds=$(printf '%s' "$versions" | jq -c --argjson keep "$KEEP_BUILDS" '
            [ .[] | select(((.metadata.container.tags) // []) | length > 0) ]
            | sort_by(.created_at)
            | if length > $keep then .[0:(length-$keep)] else [] end')
          n=$(printf '%s' "$builds" | jq 'length')
          if [ "$n" = "0" ]; then
            echo "pass 2: at or under ${KEEP_BUILDS} builds, nothing to prune"
            exit 0
          fi

          # Digests belonging to KEPT builds -- nothing here may be deleted.
          # Read the kept indexes from one file and write the expanded set to another: appending to
          # the file you are reading is a loop that may or may not see its own writes.
          kept_indexes=$(mktemp); kept_digests=$(mktemp)
          printf '%s' "$versions" | jq -r --argjson keep "$KEEP_BUILDS" '
            [ .[] | select(((.metadata.container.tags) // []) | length > 0) ]
            | sort_by(.created_at) | .[-$keep:] | .[].name' > "$kept_indexes"
          cat "$kept_indexes" > "$kept_digests"
          while IFS= read -r kd; do
            [ -n "$kd" ] || continue
            curl -sf -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
              "https://ghcr.io/v2/${OWNER}/${PACKAGE}/manifests/${kd}" 2>/dev/null \
              | jq -r '.manifests[]?.digest // empty' | tr -d '\r' >> "$kept_digests"
          done < "$kept_indexes"
          sort -u "$kept_digests" -o "$kept_digests"

          deleted=0
          shared_gone=0
          for i in $(seq 0 $((n-1))); do
            b=$(printf '%s' "$builds" | jq -c ".[$i]")
            bid=$(printf '%s' "$b" | jq -r '.id')
            bdg=$(printf '%s' "$b" | jq -r '.name')
            btags=$(printf '%s' "$b" | jq -r '((.metadata.container.tags) // []) | join(",")')

            case ",$btags," in *,latest,*) echo "skip $btags (latest)"; continue ;; esac
            if grep -qxF "$bdg" "$kept_digests"; then echo "skip $btags (kept build shares it)"; continue; fi

            # `tr -d '\r'` is load-bearing and mutation-proven: a Windows jq emits CRLF, so every
            # digest ends in \r, matches no version id, and the child is skipped -- deleting the
            # index and leaving its layers behind, a half-deleted build. Removing it drops 7 of 21
            # deletions in the suite.
            #
            # The `|| [ -n "$k" ]` guard is DEFENSIVE, not load-bearing: `<<<` appends its own
            # newline, so nothing is dropped today. Removing it kills no test. It is kept for the
            # day this input becomes a pipe or a file, where a missing final newline does drop the
            # last line -- but it is documented as belt, not brace, because a comment that
            # overstates a guard is how the next person mis-ranks what matters.
            kids=$(curl -sf -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
                     "https://ghcr.io/v2/${OWNER}/${PACKAGE}/manifests/${bdg}" 2>/dev/null \
                   | jq -r '.manifests[]?.digest // empty' | tr -d '\r')
            shared=0
            while IFS= read -r k || [ -n "$k" ]; do
              [ -n "$k" ] || continue
              grep -qxF "$k" "$kept_digests" && shared=1
            done <<< "$kids"
            if [ "$shared" = "1" ]; then echo "skip $btags (child shared with a kept build)"; continue; fi

            # Index first: the tag stops resolving before its layers go, never after.
            gh api -X DELETE "${base}/packages/container/${PACKAGE}/versions/${bid}" </dev/null >/dev/null 2>&1 \
              && deleted=$((deleted+1)) || { echo "could not delete index for $btags"; continue; }
            # `gh` inherits the loop's stdin and will swallow the remaining digests, so each delete
            # reads from /dev/null. Without this only the FIRST child of each build is removed --
            # leaving exactly the half-deleted build this pass exists to avoid.
            while IFS= read -r k || [ -n "$k" ]; do
              [ -n "$k" ] || continue
              kid=$(printf '%s' "$versions" | jq -r --arg d "$k" '.[] | select(.name==$d) | .id' | tr -d '\r' | head -1)
              [ -n "$kid" ] || continue
              # Two builds can share a child: identical platform manifests get identical digests, so
              # an earlier build in this same run may already have removed it. That is NORMAL, and
              # reporting it as "could not delete" prints failures through a healthy run -- which is
              # how a log teaches you to stop reading it. Tell already-gone apart from a real error.
              err=$(gh api -X DELETE "${base}/packages/container/${PACKAGE}/versions/${kid}" </dev/null 2>&1)
              case $? in
                0) deleted=$((deleted+1)) ;;
                *) case "$err" in
                     *"not found"*|*"Not Found"*) shared_gone=$((shared_gone+1)) ;;
                     *) echo "could not delete child $k of $btags: ${err%%$'\n'*}" ;;
                   esac ;;
              esac
            done <<< "$kids"
          done

          {
            echo
            echo "## Pass 2 -- old tagged builds"
            echo
            echo "- keep newest: **${KEEP_BUILDS}** builds"
            echo "- builds pruned: **${n}**"
            echo "- versions deleted: **${deleted}**"
            echo "- children already removed with an earlier build (shared manifests): **${shared_gone}**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pass 2: pruned ${n} build(s), ${deleted} version(s)"
