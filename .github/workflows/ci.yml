name: CI

on:
  pull_request:
  # Invoked by build-deploy.yml on master so the deploy is gated on green tests
  # (keeping the steps in one place instead of duplicating them).
  workflow_call:

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref. Never on master: the
# deploy calls this workflow via `workflow_call`, and cancelling there would cancel
# the tests the deploy is gated on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          # Every file the install reads, not just the one it is pointed at. `pip install -r
          # requirements/dev.txt` follows that file's first line, `-r common.txt`, where 30 of
          # the 38 direct pins live -- so keying on dev.txt alone meant editing common.txt did
          # not invalidate the cache. Same shape as the trading-bot key fixed in 0.1.36.
          #
          # Honest scope: pip's is a DOWNLOAD cache keyed by URL, so a stale restore degrades
          # the hit rate rather than installing versions nobody chose. The convention violation
          # is identical; the correctness consequence is milder than for a package-manager cache
          # that restores a resolved tree.
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Check formatting (Black)
        run: black --check src tests definitions.py

      - name: Lint imports (Ruff)
        run: ruff check src tests definitions.py

      - name: Run tests
        run: pytest
