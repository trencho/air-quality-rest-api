name: Deploy Flask API with MongoDB

on:
  push:
    branches:
      - master
  # Redeploying after an infrastructure fix needed either a commit or
  # `gh run rerun <id> --failed` -- the 2026-08-19 Redis outage was resolved on the node,
  # and there was then no way to ask for a fresh deploy without pushing something. The
  # rollout is idempotent (`kubectl apply` plus a rollout restart), so re-running it
  # against an unchanged master is a no-op when nothing is wrong.
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes previously raced on the same server directory, both running
# git reset --hard concurrently. Deploys now queue instead, and an in-flight one
# is never cancelled half-way through a rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # The image is built HERE, on the runner, and pushed to GHCR -- not on the
  # deploy host.
  #
  # It used to be built on the node by build_docker_images.sh (`docker compose
  # build`) and consumed with `imagePullPolicy: Never`. That silently stopped
  # working when the node moved to containerd: `docker build` writes to Docker's
  # image store, kubelet reads containerd's, and the two are separate. flask sat
  # in ErrImageNeverPull and /api/v1/* returned 503, while `docker images` on the
  # node cheerfully listed an image the cluster could not see.
  build-and-push:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GHCR. Scoped to this job, not granted workflow-wide.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: :latest for the Deployment to track, and the commit SHA so a
      # specific build can be identified and rolled back to.
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Nothing is deployed unless an image was actually published.
    needs: build-and-push
    runs-on: ubuntu-latest

    # A backstop against a hung runner, not a second deadline competing with the
    # rollout budgets -- so it has to sit ABOVE them. deploy_kubernetes_resources.sh
    # allows mongo 10m + redis 10m + flask 20m, and reload_pods.sh then waits on two
    # more rollouts with no --timeout at all, so a slow-but-succeeding deploy can
    # legitimately run for well over half an hour. A tighter value here would kill
    # exactly the deploy it was meant to protect.
    #
    # Without this the default is 6 hours, and because this job holds the
    # deploy-production concurrency group, a genuinely stuck step queues every later
    # deploy behind it for that whole time. One did stall for 18 minutes on
    # `Install OpenVPN` (normally ~10s) on 2026-08-19.
    timeout-minutes: 60

    # Scoped to this job, not the workflow.
    #
    # These 14 are the production deploy credentials -- an SSH private key, the full OpenVPN
    # credential set, and a repo access token. Declared at workflow level they were injected into
    # the environment of every job, so `build-and-push` ran with all of them while needing only
    # GITHUB_TOKEN for GHCR, alongside four third-party actions. Every consumer of every one of
    # these is a step of this job.
    #
    # `test` was never exposed, but by accident rather than design: it is a reusable-workflow call
    # (`uses: ./.github/workflows/test.yml`), and a called workflow does not inherit the caller's
    # env.
    env:
      OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
      OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
      OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
      CA_CERT: ${{ secrets.CA_CERT }}
      CLIENT_CERT: ${{ secrets.CLIENT_CERT }}
      TLS_CRYPT_KEY: ${{ secrets.TLS_CRYPT_KEY }}
      USER_KEY: ${{ secrets.USER_KEY }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GIT_REPO_PATH: ${{ secrets.GIT_REPO_PATH }}
      GIT_REPO_USERNAME: ${{ secrets.GIT_REPO_USERNAME }}
      GIT_REPO_NAME: ${{ secrets.GIT_REPO_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # OPENVPN_CONFIG holds a *path*, and it is a secret, so when the file is
      # missing the VPN action reports `config file '***' not found` -- masked,
      # and therefore impossible to act on. That is exactly what happened in
      # aqra-frontend when the .ovpn was deleted as "unreferenced": the only
      # reference lived in the secret, so grep found nothing and two days went
      # into diagnosing it.
      #
      # Fail here instead, before the two-minute apt install, and say which file
      # this repository actually ships.
      - name: Verify the OpenVPN config file exists
        run: |
          if [ ! -f "${OPENVPN_CONFIG}" ]; then
            echo "::error::OPENVPN_CONFIG names a file that is not in the checkout."
            echo "The secret must hold a path, relative to the repository root, to an"
            echo "OpenVPN config. This repository ships one at:"
            echo "    .github/workflows/client.ovpn"
            echo "Present in .github/workflows right now:"
            ls -A .github/workflows
            exit 1
          fi
          echo "OpenVPN config found."

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Create necessary OpenVPN key files
        run: |
          sudo mkdir -p /etc/openvpn
          echo "${CA_CERT}" | sudo tee /etc/openvpn/ca.crt > /dev/null
          echo "${CLIENT_CERT}" | sudo tee /etc/openvpn/client.crt > /dev/null
          echo "${TLS_CRYPT_KEY}" | sudo tee /etc/openvpn/tls-crypt.key > /dev/null

      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3.1.0
        with:
          config_file: ${{ env.OPENVPN_CONFIG }}
          echo_config: false
          username: ${{ env.OPENVPN_USERNAME }}
          password: ${{ env.OPENVPN_PASSWORD }}
          client_key: ${{ env.USER_KEY }}

      - name: SSH commands for checkout/update git repo, build and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          # The action's default command_timeout is 10m, but flask's startupProbe
          # allows up to 15 minutes for its boot-time data fetch and the deploy script
          # blocks on `kubectl rollout status`. Without this the SSH step is killed
          # mid-rollout and the deploy reports failure for a pod that was starting
          # normally.
          command_timeout: 25m
          script: |
            set -e # Stop execution on any error

            echo "Setting up environment variables..."
            export ACCESS_TOKEN=${{ env.ACCESS_TOKEN }}
            export GIT_REPO_NAME=${{ env.GIT_REPO_NAME }}
            export GIT_REPO_PATH=${{ env.GIT_REPO_PATH }}
            export GIT_REPO_USERNAME=${{ env.GIT_REPO_USERNAME }}
            export SSH_USERNAME=${{ env.SSH_USERNAME }}

            echo "Cloning/Updating repository..."
            mkdir -p "${GIT_REPO_PATH}"

            if [ ! -d "${GIT_REPO_PATH}/.git" ]; then
              echo "Repository not found. Cloning..."
              git clone https://"${ACCESS_TOKEN}"@github.com/"${GIT_REPO_USERNAME}"/"${GIT_REPO_NAME}".git "${GIT_REPO_PATH}"
              cd "${GIT_REPO_PATH}" || exit
            else
              echo "Repository found. Fetching latest changes..."
              cd "${GIT_REPO_PATH}" || exit
              git fetch origin
              git reset --hard origin/master
            fi
            
            echo "Setting correct ownership..."
            chown -R "${SSH_USERNAME}:${SSH_USERNAME}" "${GIT_REPO_PATH}"

            echo "Making scripts executable..."
            find .github/workflows -type f -name "*.sh" -exec chmod +x {} +

            echo "Executing deployment scripts..."
            .github/workflows/deploy_kubernetes_resources.sh

            echo "Restarting Kubernetes Deployments..."
            .github/workflows/reload_pods.sh

            echo "Deployment successful!"