apiVersion: v1
kind: ServiceAccount
metadata:
  name: flask-restart-sa
  namespace: aqra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flask-restart-role
  namespace: aqra
rules:
  - apiGroups: [ "apps" ]
    resources: [ "deployments" ]
    verbs: [ "get", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flask-restart-rolebinding
  namespace: aqra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flask-restart-role
subjects:
  - kind: ServiceAccount
    name: flask-restart-sa
    namespace: aqra
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flask-restart
  namespace: aqra
spec:
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          containers:
            # `args`, not `command`. This ran `/bin/sh -c "kubectl ..."` under
            # bitnami/kubectl, which is Debian-based and has a shell. #40 pinned
            # registry.k8s.io/kubectl instead, which is DISTROLESS -- its config is
            # `Entrypoint: ["/bin/kubectl"]` with no Cmd and no /bin/sh -- so every run
            # since has died before kubectl started, with
            # `exec: "/bin/sh": stat /bin/sh: no such file or directory` and then
            # BackoffLimitExceeded. The image's entrypoint IS kubectl, so the arguments
            # go straight to it and no shell is involved.
            - args:
                - rollout
                - restart
                - deployment
                - flask
                - -n
                - aqra
              image: registry.k8s.io/kubectl:v1.36.3
              name: kubectl
          restartPolicy: OnFailure
          serviceAccountName: flask-restart-sa
  schedule: 0 0 * * *
  successfulJobsHistoryLimit: 1