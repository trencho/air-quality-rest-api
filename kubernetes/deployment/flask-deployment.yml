apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: flask
  name: flask
  namespace: aqra
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flask
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/aqra-network: "true"
        io.kompose.service: flask
    spec:
      automountServiceAccountToken: false
      containers:
        - envFrom:
            - configMapRef:
                name: flask-config
            - secretRef:
                name: flask-secret
          # Built by CI and pulled from GHCR, not built on the node. The old
          # `aqra-flask` / `Never` pairing required a node-local image, and
          # `docker compose build` writes to Docker's image store while kubelet
          # reads containerd's -- so this Deployment sat in ErrImageNeverPull and
          # /api/v1/* returned 503. Same bug, same fix, as aqra-frontend PR #10.
          image: ghcr.io/trencho/air-quality-rest-api:latest
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 1
            httpGet:
              path: /api/v1/healthz/live
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 300
            timeoutSeconds: 60
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /api/v1/healthz/ready
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 300
            timeoutSeconds: 60
          name: flask
          ports:
            - containerPort: 80
          resources: { }
          volumeMounts:
            - mountPath: /var/api
              name: flask-data
      volumes:
        - name: flask-data
          persistentVolumeClaim:
            claimName: flask-data-pvc